name: publish

# Publishes this package to npm on a version tag, using npm's trusted publishing
# (OIDC): no long-lived token exists, and the release carries provenance pointing
# back at this repository, this workflow and this commit.
#
# One-time setup, per package, on npmjs.com:
#   Package page → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: poly-creator
#     Repository:           this repository's name
#     Workflow filename:    publish.yml
#     Allowed actions:      allow direct publishing (`npm publish`)
#                           — the alternative, `npm stage publish`, is always
#                           allowed but needs a maintainer to approve each
#                           version by hand.
#
# Until that connection exists this job fails at the publish step with an
# authentication error — it never publishes silently.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The OIDC exchange. Without it npm cannot authenticate the workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A published version is immutable, so a tag that disagrees with
      # package.json would poison the version line.
      - name: Guard tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p 'require("./package.json").version')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag != package.json version $version"
            exit 1
          fi

      - name: Check, build, test
        run: |
          pnpm run check
          pnpm run build
          pnpm test

      - name: Publish (trusted publishing + provenance)
        run: pnpm publish --access public --provenance --no-git-checks
